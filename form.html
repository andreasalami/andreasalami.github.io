<body class="home-page form-page">
    <nav class="top-bar liquid-glass" aria-label="Primary navigation">
        <div class="logo">
            <a href="index.html" aria-label="Home"><img src="images/logo.png" alt="Andrea Salami" class="img-fluid"></a>
        </div>
        <div class="cv">
            <a href="curriculum.html" aria-label="Curriculum"><i class="bi bi-file-earmark-person nav-icon" data-lucide="file-user" aria-hidden="true"></i></a>
        </div>
        <div class="contact">
            <a href="form.html" aria-label="Contact me" aria-current="page"><i class="bi bi-send nav-icon" data-lucide="send" aria-hidden="true"></i></a>
        </div>
    </nav>
    <div class="background">
        <div class="form-box">
            <form id="contact-form" class="compile-box" autocomplete="on">
                <p class="form-kicker">Contact</p>
                <h1>Stay in touch.</h1>
                <p class="form-intro">If you have any questions or would like more information, fill out the form and I’ll get back to you as soon as possible.</p>
                <div class="form-grid">
                    <div class="compile">
                        <label for="full-name">Name</label>
                        <input id="full-name" name="user_name" type="text" placeholder="Your name" autocomplete="name" required/>
                    </div>
                    <div class="compile">
                        <label for="email">Email</label>
                        <input id="email" name="user_email" type="email" placeholder="you@example.com" autocomplete="email" required/>
                    </div>
                    <div class="compile compile-message">
                        <label for="abstract">Message</label>
                        <textarea id="abstract" name="message" placeholder="Tell me what you have in mind…" rows="6" required></textarea>
                    </div>
                </div> 
                <!--<div>    
                    <input type="checkbox" id="privacy-consent" required>
                    <label for="privacy-consent">I agree to the <a href="/privacy-policy" target="_blank">Privacy Policy</a>.</label>
                </div>-->
                <div class="form-actions">
                    <button type="submit" class="submit">
                        <span>Send message</span>
                        <i class="bi bi-send nav-icon" data-lucide="send" aria-hidden="true"></i>
                    </button>
                </div>
                <p id="response-message" role="status" aria-live="polite"></p>
            </form>
        </div>
    </div>
    <div class="sticky-menu">
        <button type="button" class="menu-toggle-label liquid-glass" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sticky-navigation">
            <span class="menu-glyph" aria-hidden="true"></span>
        </button>
        <ul class="menu-items" id="sticky-navigation">
            <li><a class="liquid-glass" href="index.html" aria-label="Home"><i class="bi bi-house nav-icon" data-lucide="house" aria-hidden="true"></i></a></li>
            <li><a class="liquid-glass" href="form.html" aria-label="Contact me" aria-current="page"><i class="bi bi-chat nav-icon" data-lucide="message-circle" aria-hidden="true"></i></a></li>
            <li><a class="liquid-glass" href="curriculum.html" aria-label="Curriculum"><i class="bi bi-file-earmark-person nav-icon" data-lucide="file-user" aria-hidden="true"></i></a></li>
        </ul>
    </div>
    <nav class="bottom-bar">
        <div class="social-links">
            <a href="https://www.linkedin.com/in/andrea-salami-204908209/" target="_blank">
                <i class="fab fa-linkedin"></i> LinkedIn
            </a>
        </div>
        <br>
        <div class="social-links">
            <a href="https://github.com/andreasalami" target="_blank">
                <i class="fab fa-github"></i> GitHub
            </a>
        </div>
        <br>
        <div class="social-links">
            <a href="https://x.com/salami_andrea" target="_blank">
                <i class="fab fa-twitter"></i> X
            </a>
        </div>
        <div class="social-links">
            <a href="https://www.instagram.com/lagroaigiovani/" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
        </div>
    </nav>
    <script src="https://unpkg.com/lucide@1.27.0/dist/umd/lucide.min.js" defer></script>
    <script src="liquid-glass.js" defer></script>
    <script>
        (function() {
            emailjs.init("DAJUVCkBosM0mjVOD"); 

            document.getElementById("contact-form").addEventListener("submit", function(event) {
                event.preventDefault();
                emailjs.sendForm("salami.andreaa@gmail.com", "contact_form", this)
                    .then(() => {
                        document.getElementById("response-message").innerText = "Message sent successfully!";
                        this.reset();
                    }, (err) => {
                        document.getElementById("response-message").innerText = "Error sending message.";
                    });
            });
        })();
    </script>
</body>
